# Checks every pull request, and the default branch after each merge. Nothing
# here reaches the live Supabase project: the database tests run in memory
# (PGlite), and the browser tests run against a throwaway local Supabase
# started inside the job. No secrets needed.
name: CI

on:
  push:
    branches: [claude/jolly-cannon-i4y7vh]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  types:
    name: Types and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src tests e2e

  tests:
    # the database tests, split across two machines
    name: Tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run --shard=${{ matrix.shard }}/2

  e2e:
    name: Browser tests (local Supabase)
    runs-on: ubuntu-24.04  # Playwright 1.56 cannot install its browser on ubuntu-latest (26.04)
    timeout-minutes: 45
    env:
      # the local stack's public demo keys, as in playwright.config.ts
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - name: Start a throwaway Supabase, build the app and install the browser, side by side
        run: |
          supabase start > supabase.log 2>&1 & s=$!
          npx next build > build.log 2>&1 & b=$!
          npx playwright install --with-deps chromium > playwright.log 2>&1 & p=$!
          fail=0
          wait $s || { echo "::group::supabase start"; cat supabase.log; echo "::endgroup::"; fail=1; }
          wait $b || { echo "::group::next build"; cat build.log; echo "::endgroup::"; fail=1; }
          wait $p || { echo "::group::playwright install"; cat playwright.log; echo "::endgroup::"; fail=1; }
          exit $fail
      - name: Load the schema, migrations and test users
        run: ./e2e/setup-db.sh
      - name: Browser tests
        run: npx playwright test
        env:
          CI: "1"
          E2E_PREBUILT: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/report
            test-results
            supabase.log
            build.log
          retention-days: 7
